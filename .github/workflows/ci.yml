name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check inventree_label_dispatch tests
      # Only the pure job-building and extractor logic is unit-tested here; the driver
      # and plugin import InvenTree's machine/plugin packages and are validated on the
      # running instance.
      - run: pytest -q
